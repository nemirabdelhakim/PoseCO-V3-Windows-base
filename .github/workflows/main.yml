
name: Build Pose CO V3 Windows 7

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Windows x64 Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify project files
        shell: pwsh
        run: |
          if (!(Test-Path "main.js")) {
            throw "main.js introuvable"
          }
          if (!(Test-Path "preload.js")) {
            throw "preload.js introuvable"
          }
          if (!(Test-Path "src/index.html")) {
            throw "src/index.html introuvable"
          }

      - name: Build portable EXE
        run: npm run dist:win

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem "release" -Filter "*.exe" -Recurse |
            Select-Object -First 1
          if (!$exe) {
            throw "Aucun fichier EXE généré"
          }
          Write-Host "EXE généré : $($exe.FullName)"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pose-CO-V3-Windows7-SP1-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
